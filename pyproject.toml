[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-master-standalone"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["PySide6==6.8.1", "Pillow==11.0.0", "httpx==0.28.1", "psutil==6.1.1"]

[project.scripts]
prompt-master = "prompt_master.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
